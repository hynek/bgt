[tox]
requires =
    tox>=4.51.1
    tox-uv-bare
env_list =
    lint-{ruff,pre-commit},
    typing-{mypy,pyright,ty,pyrefly},
    3.1{2-5}-tests,
    coverage-{combine,report},
    docs-build


[testenv]
runner = uv-venv-lock-runner
package = wheel
wheel_build_env = .pkg
dependency_groups =
    tests: cov
commands =
    coverage run -m pytest {posargs}


[testenv:coverage-combine]
base_python_file = .python-version
depends = *-tests
package = skip
dependency_groups = cov
commands = coverage combine

[testenv:coverage-report]
base_python_file = .python-version
depends = coverage-combine
dependency_groups = cov
package = skip
commands =
    coverage report
    coverage html


[testenv:lint-{ruff,pre-commit}]
base_python_file = .python-version
dependency_groups = lint
package = skip
commands =
    ruff: ruff check --fix --exit-non-zero-on-fix .
    ruff: ruff format --exit-non-zero-on-format .
    pre-commit: prek run --all-files {posargs}


[testenv:typing-{mypy,pyright,ty,pyrefly}]
base_python_file = .python-version
dependency_groups =
    mypy: mypy
    pyright: pyright
    ty: ty
    pyrefly: pyrefly
commands =
    mypy: mypy typing_tests src docs/examples
    pyright: pyright
    ty: ty check
    pyrefly: pyrefly check


# Build (and serve) the documentation site with Zensical.
[testenv:docs-{build,serve}]
base_python_file = .python-version
dependency_groups = docs
commands =
    build: zensical build {posargs}
    serve: zensical serve {posargs}
